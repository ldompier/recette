databaseChangeLog:
  - changeSet:
      id: 001-create-recipe-schema
      author: codex
      changes:
        - createTable:
            tableName: recipe
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_recipe
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: image_url
                  type: VARCHAR(500)
        - createTable:
            tableName: ingredient
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ingredient
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_order
                  type: INT
                  constraints:
                    nullable: false
        - createTable:
            tableName: preparation_step
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_preparation_step
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: step_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: ingredient
            baseColumnNames: recipe_id
            referencedTableName: recipe
            referencedColumnNames: id
            constraintName: fk_ingredient_recipe
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: preparation_step
            baseColumnNames: recipe_id
            referencedTableName: recipe
            referencedColumnNames: id
            constraintName: fk_preparation_step_recipe
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: ingredient
            columnNames: recipe_id, display_order
            constraintName: uk_ingredient_recipe_display_order
        - addUniqueConstraint:
            tableName: preparation_step
            columnNames: recipe_id, step_number
            constraintName: uk_preparation_step_recipe_step_number
        - createIndex:
            tableName: ingredient
            indexName: idx_ingredient_recipe
            columns:
              - column:
                  name: recipe_id
        - createIndex:
            tableName: preparation_step
            indexName: idx_preparation_step_recipe
            columns:
              - column:
                  name: recipe_id
